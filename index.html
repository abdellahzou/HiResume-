<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiResume | Free Resume Builder</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; background-color: #f8fafc; }

    /* =========================
       PRINT / PDF FIX
    ========================= */
    @media print {
      @page { size: A4; margin: 0; }
      
      /* Hide everything by default */
      body * { display: none !important; }
      
      /* Show ONLY the resume preview and its children */
      #resume-preview-root, #resume-preview-root * { display: block !important; }
      #resume-preview, #resume-preview * { display: block !important; }
      
      /* Force specific block display for layout elements */
      #resume-preview .flex, #resume-preview [class*="flex"] { display: flex !important; }
      #resume-preview .grid, #resume-preview [class*="grid"] { display: grid !important; }

      html, body {
        width: 210mm;
        height: 297mm;
        overflow: hidden !important;
        background: white !important;
      }

      #resume-preview-root {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      #resume-preview {
        width: 210mm !important;
        height: 297mm !important;
        transform: none !important; /* Critical: remove scale for PDF */
        box-shadow: none !important;
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
      }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>

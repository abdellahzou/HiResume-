    <meta charset="UTF-8" />

    <title>HiResume | Free Resume Builder</title>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      // Initialize Worker immediately
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* =========================
       PRINT / PDF RULES
    ========================= */
    @media print {
      @page {
        size: A4;
        margin: 0;
      }

      /* Hide everything by default */
      body * {
        visibility: hidden;
      }

      /* Explicitly show the preview container and all its children */
      #resume-preview,
      #resume-preview * {
        visibility: visible;
      }

      /* Position the preview correctly for the printer */
      #resume-preview {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        
        /* Force strictly A4 dimensions */
        width: 210mm !important;
        height: 297mm !important;
        
        /* Remove any visual scaling transformations used for the screen preview */
        transform: none !important;
        
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        
        /* Ensure colors print exactly as seen */
        print-color-adjust: exact !important;
        -webkit-print-color-adjust: exact !important;
        
        z-index: 9999;
        overflow: hidden !important;
      }

      /* Hide typical UI elements explicitly just in case */
      .no-print, header, footer, aside {
        display: none !important;
      }
    }
    
    /* Utilities */
    .no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    </style>
</head>

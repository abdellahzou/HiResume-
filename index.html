    <meta charset="UTF-8" />

    <title>HiResume | Free Resume Builder</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

      if (window.pdfjsLib) {

      }

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* =========================
       STRICT PRINT RULES
    ========================= */
    @media print {
      @page {
        size: A4;
        margin: 0 !important;
      }

      html, body {
        width: 210mm !important;
        height: 297mm !important;
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important; /* STRICTLY prevent page 2 */
        print-color-adjust: exact !important;
        -webkit-print-color-adjust: exact !important;
      }

      /* 
         OVERRIDE CSS VARIABLES FOR PRINT 
         Force scale factor to 1 to remove mobile "mini-pdf" effect
      */
      * {
        --scale-factor: 1 !important;
      }

      /* Reset any screen scaling on wrapper divs */
      .print\:transform-none {
          transform: none !important;
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
      }

      /* 
         VISIBILITY STRATEGY 
         We hide everything, then show only the resume.
         We do NOT use display:none on body children because it kills React roots.
      */
      body * {
        visibility: hidden;
      }

      #resume-preview,
      #resume-preview * {
        visibility: visible;
      }
      
      /* Ensure the resume breaks out of any hidden containers */
      #resume-preview {
        display: block !important;
        position: absolute !important; /* Absolute avoids transform stacking context issues compared to fixed */
        left: 0 !important;
        top: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        z-index: 9999;
        background: white !important;
      }

      .no-print {
        display: none !important;
      }
    }
    </style>
</head>
